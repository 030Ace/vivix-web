<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lando Effect Test - Minimalist</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000000;
            color: white;
            font-family: 'Inter', sans-serif;
        }

        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
        }

        main {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
            pointer-events: none;
        }

        h1 {
            font-size: 8rem;
            text-transform: uppercase;
            letter-spacing: -2px;
            margin: 0;
            z-index: 10;
            text-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
        }

        p {
            font-size: 1.5rem;
            color: #ccc;
            z-index: 10;
        }
    </style>
</head>

<body>

    <div id="canvas-container"></div>

    <main>
        <h1>Lando Effect</h1>
        <p>Minimalist Contours</p>
    </main>

    <!-- Three.js from CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // --- Shader Code ---
        const vertexShader = `
            varying vec2 vUv;
            void main() {
                vUv = uv;
                gl_Position = vec4(position, 1.0);
            }
        `;

        const fragmentShader = `
            uniform float uTime;
            uniform vec2 uResolution;
            uniform vec2 uMouse;
            uniform float uClickTime; 
            uniform vec2 uClickPos;   
            varying vec2 vUv;

            // Noise functions
            vec3 mod289(vec3 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
            vec2 mod289(vec2 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
            vec3 permute(vec3 x) { return mod289(((x*34.0)+1.0)*x); }

            float snoise(vec2 v) {
                const vec4 C = vec4(0.211324865405187,  // (3.0-sqrt(3.0))/6.0
                                    0.366025403784439,  // 0.5*(sqrt(3.0)-1.0)
                                    -0.577350269189626, // -1.0 + 2.0 * C.x
                                    0.024390243902439); // 1.0 / 41.0
                vec2 i  = floor(v + dot(v, C.yy) );
                vec2 x0 = v - i + dot(i, C.xx);
                vec2 i1;
                i1 = (x0.x > x0.y) ? vec2(1.0, 0.0) : vec2(0.0, 1.0);
                vec4 x12 = x0.xyxy + C.xxzz;
                x12.xy -= i1;
                i = mod289(i); 
                vec3 p = permute( permute( i.y + vec3(0.0, i1.y, 1.0 ))
                    + i.x + vec3(0.0, i1.x, 1.0 ));

                vec3 m = max(0.5 - vec3(dot(x0,x0), dot(x12.xy,x12.xy), dot(x12.zw,x12.zw)), 0.0);
                m = m*m ;
                m = m*m ;
                vec3 x = 2.0 * fract(p * C.www) - 1.0;
                vec3 h = abs(x) - 0.5;
                vec3 ox = floor(x + 0.5);
                vec3 a0 = x - ox;
                m *= 1.79284291400159 - 0.85373472095314 * ( a0*a0 + h*h );
                vec3 g;
                g.x  = a0.x  * x0.x  + h.x  * x0.y;
                g.yz = a0.yz * x12.xz + h.yz * x12.yw;
                return 130.0 * dot(m, g);
            }

            void main() {
                vec2 st = gl_FragCoord.xy / uResolution.xy;
                st.x *= uResolution.x / uResolution.y;

                // --- 1. Mouse Repulsion ---
                vec2 mouseRaw = uMouse / uResolution.xy;
                mouseRaw.x *= uResolution.x / uResolution.y;
                
                float dist = distance(st, mouseRaw);
                // Larger smooth radius for gentle push
                float repulsionRadius = 0.6; 
                float repulsionStrength = smoothstep(repulsionRadius, 0.0, dist); 
                vec2 pushDir = normalize(st - mouseRaw);
                
                // Reduced force (0.05) and smoothed interaction
                vec2 offsetSt = st - (pushDir * repulsionStrength * 0.06);

                // --- 2. Click Ripple ---
                float wave = 0.0;
                if (uClickTime > 0.0) {
                    float timeSinceClick = uTime - uClickTime;
                    vec2 clickPosRaw = uClickPos / uResolution.xy;
                    clickPosRaw.x *= uResolution.x / uResolution.y;
                    
                    float distClick = distance(st, clickPosRaw);
                    float waveRadius = timeSinceClick * 0.4; // Slower wave
                    float ringWidth = 0.15;
                    float ring = smoothstep(ringWidth, 0.0, abs(distClick - waveRadius));
                    float fade = smoothstep(3.0, 0.0, timeSinceClick); // Longer fade
                    wave = ring * fade * 0.15; 
                }
                offsetSt -= (pushDir * wave); 

                // --- 3. Noise for Contours ---
                // VERY SLOW Time factor for "liquid" feel
                float t = uTime * 0.05; 

                // Minimalist Noise: Lower frequency for LARGER bubbles
                float n1 = snoise(vec2(offsetSt.x * 0.7 + t, offsetSt.y * 0.7 - t * 0.3));
                float n2 = snoise(vec2(offsetSt.x * 1.2 - t * 0.2, offsetSt.y * 1.2 + t * 0.5));
                
                float height = (n1 + n2 * 0.5) * 0.7;

                // --- Contour Lines Generation ---
                // Lower scale = Fewer lines / larger gaps
                float scale = 6.0; 
                
                float df = fract(height * scale);
                float lineWidth = 0.03; 
                
                // Create lines: 1.0 where line is, 0.0 elsewhere
                float val = smoothstep(0.0, lineWidth, df) * smoothstep(2.0 * lineWidth, lineWidth, df);
                float lines = val;

                // --- Colors ---
                vec3 black = vec3(0.0);
                vec3 white = vec3(0.95); 
                
                // Mix Black Background (0.0) with White Lines (1.0)
                vec3 finalColor = mix(black, white, lines);

                // Add minimal blue glow ONLY on lines during repulsion
                if (repulsionStrength > 0.0) {
                     finalColor += vec3(0.1, 0.1, 0.4) * repulsionStrength * lines; 
                }
                
                finalColor += vec3(wave * 0.5);

                gl_FragColor = vec4(finalColor, 1.0);
            }
        `;

        // --- Three.js Setup ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
        const renderer = new THREE.WebGLRenderer({ alpha: true });

        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        const geometry = new THREE.PlaneGeometry(2, 2);
        const uniforms = {
            uTime: { value: 0 },
            uResolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) },
            uMouse: { value: new THREE.Vector2(-9999, -9999) },
            uClickTime: { value: -100.0 },
            uClickPos: { value: new THREE.Vector2(0, 0) }
        };

        const material = new THREE.ShaderMaterial({
            vertexShader: vertexShader,
            fragmentShader: fragmentShader,
            uniforms: uniforms
        });

        const mesh = new THREE.Mesh(geometry, material);
        scene.add(mesh);

        // Listeners
        window.addEventListener('mousemove', (e) => {
            uniforms.uMouse.value.x = e.clientX;
            uniforms.uMouse.value.y = window.innerHeight - e.clientY;
        });

        window.addEventListener('click', (e) => {
            uniforms.uClickTime.value = clock.getElapsedTime();
            uniforms.uClickPos.value.x = e.clientX;
            uniforms.uClickPos.value.y = window.innerHeight - e.clientY;
        });

        const clock = new THREE.Clock();
        function animate() {
            uniforms.uTime.value = clock.getElapsedTime();
            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }

        animate();

        window.addEventListener('resize', () => {
            const width = window.innerWidth;
            const height = window.innerHeight;
            renderer.setSize(width, height);
            uniforms.uResolution.value.set(width, height);
        });
    </script>
</body>

</html>
