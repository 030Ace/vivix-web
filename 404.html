    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.4/gsap.min.js"></script>
    <script src="assets/js/content.js"></script> <!-- Reusing for menu population -->
    <script src="assets/js/script.js"></script> <!-- Reusing for menu interaction -->

    <script>
        // Specific 404 Animation Script
        document.addEventListener('DOMContentLoaded', () => {
            // "The Reveal" - Skew Up Effect
            // Start state is handled in CSS (opacity: 0, transform).
            // We animate TO the final state.

            gsap.to('.skew-up', {
                y: 0,
                opacity: 1,
                rotateX: 0, // Optional slight unfold
                skewY: 0,
                duration: 1.2,
                stagger: 0.15,
                ease: "power4.out",
                delay: 0.2
                // Removed clearProps to prevent reverting to opacity: 0
            });
        });
    </script>
